name: M0A

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: M0A checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: fixture-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FX_DB_HOST: 127.0.0.1
      FX_DB_PORT: 5432
      FX_DB_ADMIN_USER: postgres
      # Ephemeral credentials for this isolated CI service only.
      FX_DB_ADMIN_PASSWORD: fixture-ci-postgres
      FX_PAPER_PASSWORD: fixture-ci-paper
      FX_LIVE_PASSWORD: fixture-ci-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest --integration -q
