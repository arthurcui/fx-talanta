[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fx-talanta"
version = "0.3.0"
description = "Portable, account-isolated offline risk, execution and recovery (M0C)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
mt5 = ["MetaTrader5==5.0.6231; sys_platform == 'win32'"]

[project.scripts]
fx-talanta = "fx_talanta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fx_talanta = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the isolated local PostgreSQL cluster"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
